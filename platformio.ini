; DLMS MINI 240 - UI only (LCD 1.77" ST7735S + encoder HW-040) - ESP32-S3
[env:esp32s3]
platform = espressif32@^6.8.1
board = esp32-s3-devkitc-1
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; index.html di-embed lewat src/CMakeLists.txt (EMBED_TXTFILES)

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; DSP float lebih cepat dengan -O2 (default Arduino = -Os)
build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    ; Serial lewat port USB native (hapus kalau pakai port UART/COM)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

    ; ---- TFT_eSPI (tanpa edit User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DST7735_DRIVER=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    ; Kalau warna/posisi salah, coba ganti satu per satu:
    ;   ST7735_BLACKTAB / ST7735_GREENTAB2 / ST7735_GREENTAB3 / ST7735_REDTAB
    -DST7735_BLACKTAB
    ; Kalau warna terbalik (merah<->biru): aktifkan baris di bawah
    ;-DTFT_RGB_ORDER=TFT_BGR
    ; Kalau warna negatif/inverted:
    ;-DTFT_INVERSION_ON

    ; GPIO pins diatur terpusat di src/pins.h
    -include ${PROJECT_SRC_DIR}/pins.h


    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=10000000
