                     oninput="onBandGainSlider(this.value)">
              <div class="stepper-btn-group">
                <button class="btn-step-sm" onclick="stepBandGain(0.1)">+0.1</button>
                <button class="btn-step-sm" onclick="stepBandGain(1.0)">+1</button>
              </div>
            </div>
          </div>

          <!-- 3. Q FACTOR SLIDER -->
          <div class="studio-slider-box">
            <div class="slider-box-head">
              <span class="slider-box-title">Q FACTOR (WIDTH)</span>
              <span class="slider-box-value" id="bi-q-val" style="color:var(--yellow);">
                ${b.q.toFixed(2)}
              </span>
            </div>
            <div class="slider-control-row">
              <div class="stepper-btn-group">
                <button class="btn-step-sm" onclick="stepBandQ(-0.5)">-0.5</button>
                <button class="btn-step-sm" onclick="stepBandQ(-0.05)">-0.05</button>
              </div>
              <input type="range" min="30" max="2000" step="5" id="bi-q-sl"
                     value="${Math.round(b.q * 100)}"
                     oninput="onBandQSlider(this.value)">
              <div class="stepper-btn-group">
                <button class="btn-step-sm" onclick="stepBandQ(0.05)">+0.05</button>
                <button class="btn-step-sm" onclick="stepBandQ(0.5)">+0.5</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function updateBandInspectorControls(idx) {
      if (idx !== selectedBandIdx) return;
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      if (!ch || !ch.peq) return;
      const b = ch.peq[idx];
      if (!b) return;

      const fVal = document.getElementById('bi-freq-val');
      const fSl = document.getElementById('bi-freq-sl');
      const gVal = document.getElementById('bi-gain-val');
      const gSl = document.getElementById('bi-gain-sl');
      const qVal = document.getElementById('bi-q-val');
      const qSl = document.getElementById('bi-q-sl');

      if (fVal) fVal.textContent = b.f >= 1000 ? (b.f / 1000).toFixed(2) + ' kHz' : b.f + ' Hz';
      if (fSl && document.activeElement !== fSl) fSl.value = freqToLogSlider(b.f);

      if (gVal) {
        gVal.textContent = `${b.g >= 0 ? '+' : ''}${b.g.toFixed(1)} dB`;
        gVal.style.color = b.g > 0 ? 'var(--cyan)' : b.g < 0 ? 'var(--orange)' : '#fff';
      }
      if (gSl && document.activeElement !== gSl) gSl.value = Math.round(b.g * 10);

      if (qVal) qVal.textContent = b.q.toFixed(2);
      if (qSl && document.activeElement !== qSl) qSl.value = Math.round(b.q * 100);

      // Table row inputs
      const tblF = document.getElementById(`peq-tbl-f-${idx}`);
      const tblG = document.getElementById(`peq-tbl-g-${idx}`);
      const tblQ = document.getElementById(`peq-tbl-q-${idx}`);
      if (tblF && document.activeElement !== tblF) tblF.value = b.f;
      if (tblG && document.activeElement !== tblG) tblG.value = b.g;
      if (tblQ && document.activeElement !== tblQ) tblQ.value = b.q;
    }

    function selectBand(idx) {
      selectedBandIdx = idx;
      renderBandInspector();
      drawPeqCurve();
    }

    function selectBandType(type) {
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      const b = ch.peq[selectedBandIdx];
      b.type = type;
      drawPeqCurve();
      renderBandInspector();
      setPath(`${activeChType}s.${activeChIdx}.peq.${selectedBandIdx}.type`, type);
    }

    function toggleSelectedBand(on) {
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      const b = ch.peq[selectedBandIdx];
      b.on = on;
      const st = document.getElementById('band-on-state');
      if (st) st.textContent = on ? 'BAND ON' : 'BYPASS';
      drawPeqCurve();
      setPath(`${activeChType}s.${activeChIdx}.peq.${selectedBandIdx}.on`, on ? 1 : 0);
    }

    function resetSelectedBandFlat() {
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      const b = ch.peq[selectedBandIdx];
      b.g = 0;
      drawPeqCurve();
      updateBandInspectorControls(selectedBandIdx);
      setPath(`${activeChType}s.${activeChIdx}.peq.${selectedBandIdx}.g`, 0);
    }

    function onBandFreqSlider(val) {
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      const b = ch.peq[selectedBandIdx];
      const f = logSliderToFreq(val);
      b.f = f;
      if (!b.on) b.on = true;
      drawPeqCurve();
      updateBandInspectorControls(selectedBandIdx);
      throttledSetPath(`${activeChType}s.${activeChIdx}.peq.${selectedBandIdx}.f`, f);
    }

    function stepBandFreq(delta) {
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      const b = ch.peq[selectedBandIdx];
      let f = Math.max(20, Math.min(20000, b.f + delta));
      b.f = f;
      drawPeqCurve();
      updateBandInspectorControls(selectedBandIdx);
      setPath(`${activeChType}s.${activeChIdx}.peq.${selectedBandIdx}.f`, f);
    }

    function onBandGainSlider(val) {
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      const b = ch.peq[selectedBandIdx];
      const g = Math.round(val) / 10;
      b.g = g;
      if (!b.on) b.on = true;
      drawPeqCurve();
      updateBandInspectorControls(selectedBandIdx);
      throttledSetPath(`${activeChType}s.${activeChIdx}.peq.${selectedBandIdx}.g`, g);
    }

    function stepBandGain(delta) {
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      const b = ch.peq[selectedBandIdx];
      let g = Math.max(-24, Math.min(24, Math.round((b.g + delta) * 10) / 10));
      b.g = g;
      drawPeqCurve();
      updateBandInspectorControls(selectedBandIdx);
      setPath(`${activeChType}s.${activeChIdx}.peq.${selectedBandIdx}.g`, g);
    }

    function onBandQSlider(val) {
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      const b = ch.peq[selectedBandIdx];
      const q = Math.round(val) / 100;
      b.q = q;
      drawPeqCurve();
      updateBandInspectorControls(selectedBandIdx);
      throttledSetPath(`${activeChType}s.${activeChIdx}.peq.${selectedBandIdx}.q`, q);
    }

    function stepBandQ(delta) {
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      const b = ch.peq[selectedBandIdx];
      let q = Math.max(0.3, Math.min(20.0, Math.round((b.q + delta) * 100) / 100));
      b.q = q;
      drawPeqCurve();
      updateBandInspectorControls(selectedBandIdx);
      setPath(`${activeChType}s.${activeChIdx}.peq.${selectedBandIdx}.q`, q);
    }

    function findHitBand(ch, x, y, w, h) {
      if (!ch || !ch.peq) return -1;
      const hitRadius = 18;
      for (let i = 0; i < ch.peq.length; i++) {
        const b = ch.peq[i];
        const bx = freqToPos(b.f, w);
        const by = gainToPos(b.g, h);
        const dist = Math.hypot(x - bx, y - by);
        if (dist <= hitRadius) return i;
      }
      return -1;
    }

    function drawPeqCurve() {
      const cvs = document.getElementById('peq-canvas');
      if (!cvs) return;
      resizeCanvas(cvs);
      const ctx = cvs.getContext('2d');
      const w = cvs.offsetWidth;
      const h = cvs.offsetHeight;
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      if (!ch || !ch.peq) return;

      drawGrid(ctx, w, h, -24, 24);

      if (!ch.peqOn) {
        ctx.strokeStyle = '#555';
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.stroke();
        ctx.setLineDash([]);
        return;
      }

      // 1. Calculate overall composite response curve points
      const curvePoints = [];
      for (let px = 0; px <= w; px += 2) {
        const f = 20 * Math.pow(10, (3 * px) / w);
        let totalDb = 0;
        ch.peq.forEach(b => {
          if (!b.on) return;
          totalDb += calcBiquadDb(b.type !== undefined ? b.type : 0, b.f, b.g, b.q, f);
        });
        if (totalDb > 24) totalDb = 24;
        if (totalDb < -24) totalDb = -24;
        const y = h - ((totalDb + 24) / 48) * h;
        curvePoints.push({ x: px, y: y });
      }

      // 2. Gradient contour fill between curve and center 0dB line (h / 2)
      if (curvePoints.length > 0) {
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        curvePoints.forEach(pt => ctx.lineTo(pt.x, pt.y));
        ctx.lineTo(w, h / 2);
        ctx.closePath();
        const fillGrad = ctx.createLinearGradient(0, 0, 0, h);
        fillGrad.addColorStop(0, 'rgba(0, 210, 240, 0.22)');
        fillGrad.addColorStop(0.5, 'rgba(0, 210, 240, 0.04)');
        fillGrad.addColorStop(1, 'rgba(255, 145, 0, 0.22)');
        ctx.fillStyle = fillGrad;
        ctx.fill();
      }

      // 3. Draw main composite curve
      ctx.beginPath();
      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 2.5;
      curvePoints.forEach((pt, idx) => {
        if (idx === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();

      // 4. Ghost individual curve for selected band
      if (selectedBandIdx >= 0 && selectedBandIdx < ch.peq.length) {
        const selB = ch.peq[selectedBandIdx];
        if (selB.on && Math.abs(selB.g) > 0.1) {
          ctx.beginPath();
          ctx.strokeStyle = PEQ_COLORS[selectedBandIdx % PEQ_COLORS.length];
          ctx.lineWidth = 1.2;
          ctx.setLineDash([3, 3]);
          for (let px = 0; px <= w; px += 3) {
            const f = 20 * Math.pow(10, (3 * px) / w);
            const db = calcBiquadDb(selB.type !== undefined ? selB.type : 0, selB.f, selB.g, selB.q, f);
            const cy = h - ((Math.max(-24, Math.min(24, db)) + 24) / 48) * h;
            if (px === 0) ctx.moveTo(px, cy);
            else ctx.lineTo(px, cy);
          }
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      // 5. Band marker nodes
      ch.peq.forEach((b, i) => {
        const x = freqToPos(b.f, w);
        const y = gainToPos(b.g, h);
        const isSelected = (i === selectedBandIdx);
        const isHovered = (i === peqHoverBand);
        const color = PEQ_COLORS[i % PEQ_COLORS.length];

        // Pulsing glow halo for selected or hovered band
        if (isSelected || isHovered) {
          ctx.beginPath();
          ctx.arc(x, y, isSelected ? 16 : 13, 0, Math.PI * 2);
          ctx.fillStyle = isSelected ? 'rgba(0, 229, 255, 0.25)' : 'rgba(255, 255, 255, 0.15)';
          ctx.fill();

          // Guide crosshairs when dragging
          if (peqDrag.isDragging && isSelected) {
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
            ctx.setLineDash([2, 2]);
            ctx.lineWidth = 1;
            // Vertical guide line
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h);
            ctx.stroke();
            // Horizontal guide line
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
            ctx.setLineDash([]);
          }
        }

        // Outer circle
        ctx.beginPath();
        ctx.arc(x, y, isSelected ? 10 : 8, 0, Math.PI * 2);
        ctx.fillStyle = b.on ? color : '#334455';
        ctx.fill();
        ctx.strokeStyle = isSelected ? '#fff' : (b.on ? '#fff' : '#667788');
        ctx.lineWidth = isSelected ? 2.5 : 1.5;
        ctx.stroke();

        // Node text
        ctx.fillStyle = b.on ? '#000' : '#aaa';
        ctx.font = `bold ${isSelected ? '10px' : '9px'} sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(i + 1, x, y);
      });

      // 6. Update HUD display
      const activeB = ch.peq[selectedBandIdx];
      if (activeB) {
        const fStr = activeB.f >= 1000 ? (activeB.f / 1000).toFixed(2) + ' kHz' : activeB.f + ' Hz';
        const gStr = `${activeB.g >= 0 ? '+' : ''}${activeB.g.toFixed(1)} dB`;
        const typeName = PEQ_TYPES[activeB.type !== undefined ? activeB.type : 0].split(' ')[0];
        
        const hudName = document.getElementById('hud-band-name');
        const hudF = document.getElementById('hud-freq-val');
        const hudG = document.getElementById('hud-gain-val');
        const hudQ = document.getElementById('hud-q-val');
        const hudT = document.getElementById('hud-type-val');

        if (hudName) hudName.textContent = `BAND ${selectedBandIdx + 1}:`;
        if (hudF) hudF.textContent = fStr;
        if (hudG) hudG.textContent = gStr;
        if (hudQ) hudQ.textContent = activeB.q.toFixed(2);
        if (hudT) hudT.textContent = typeName;
      }
    }

    function setupPeqCanvasInteraction() {
      const cvs = document.getElementById('peq-canvas');
      if (!cvs || cvs.dataset.eventsAttached) return;
      cvs.dataset.eventsAttached = "true";

      cvs.addEventListener('mousedown', (e) => {
        const pos = getCanvasEventPos(cvs, e);
        const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
        const hit = findHitBand(ch, pos.x, pos.y, pos.w, pos.h);
        if (hit !== -1) {
          selectedBandIdx = hit;
          peqDrag.isDragging = true;
          peqDrag.bandIdx = hit;
          renderBandInspector();
          drawPeqCurve();
        }
      });

      window.addEventListener('mousemove', (e) => {
        const cvs = document.getElementById('peq-canvas');
        if (!cvs) return;
        const pos = getCanvasEventPos(cvs, e);
        const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];

        if (peqDrag.isDragging && peqDrag.bandIdx !== -1) {
          const f = posToFreq(pos.x, pos.w);
          const g = posToGain(pos.y, pos.h);
          const b = ch.peq[peqDrag.bandIdx];
          b.f = f;
          b.g = g;
          if (!b.on) b.on = true;

          drawPeqCurve();
          updateBandInspectorControls(peqDrag.bandIdx);
          throttledSetPath(`${activeChType}s.${activeChIdx}.peq.${peqDrag.bandIdx}.f`, f);
          throttledSetPath(`${activeChType}s.${activeChIdx}.peq.${peqDrag.bandIdx}.g`, g);
        } else {
          const hit = findHitBand(ch, pos.x, pos.y, pos.w, pos.h);
          if (hit !== peqHoverBand) {
            peqHoverBand = hit;
            cvs.style.cursor = hit !== -1 ? 'grab' : 'crosshair';
            drawPeqCurve();
          }
        }
      });

      window.addEventListener('mouseup', () => {
        if (peqDrag.isDragging && peqDrag.bandIdx !== -1) {
          const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
          const b = ch.peq[peqDrag.bandIdx];
          setPath(`${activeChType}s.${activeChIdx}.peq.${peqDrag.bandIdx}.f`, b.f);
          setPath(`${activeChType}s.${activeChIdx}.peq.${peqDrag.bandIdx}.g`, b.g);
          peqDrag.isDragging = false;
          peqDrag.bandIdx = -1;
          drawPeqCurve();
        }
      });

      cvs.addEventListener('touchstart', (e) => {
        const pos = getCanvasEventPos(cvs, e);
        const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
        const hit = findHitBand(ch, pos.x, pos.y, pos.w, pos.h);
        if (hit !== -1) {
          if (e.cancelable) e.preventDefault();
          selectedBandIdx = hit;
          peqDrag.isDragging = true;
          peqDrag.bandIdx = hit;
          renderBandInspector();
          drawPeqCurve();
        }
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        if (peqDrag.isDragging && peqDrag.bandIdx !== -1) {
          if (e.cancelable) e.preventDefault();
          const cvs = document.getElementById('peq-canvas');
          if (!cvs) return;
          const pos = getCanvasEventPos(cvs, e);
          const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
          const f = posToFreq(pos.x, pos.w);
          const g = posToGain(pos.y, pos.h);
          const b = ch.peq[peqDrag.bandIdx];
          b.f = f;
          b.g = g;
          if (!b.on) b.on = true;

          drawPeqCurve();
          updateBandInspectorControls(peqDrag.bandIdx);
          throttledSetPath(`${activeChType}s.${activeChIdx}.peq.${peqDrag.bandIdx}.f`, f);
          throttledSetPath(`${activeChType}s.${activeChIdx}.peq.${peqDrag.bandIdx}.g`, g);
        }
      }, { passive: false });

      window.addEventListener('touchend', () => {
        if (peqDrag.isDragging && peqDrag.bandIdx !== -1) {
          const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
          const b = ch.peq[peqDrag.bandIdx];
          setPath(`${activeChType}s.${activeChIdx}.peq.${peqDrag.bandIdx}.f`, b.f);
          setPath(`${activeChType}s.${activeChIdx}.peq.${peqDrag.bandIdx}.g`, b.g);
          peqDrag.isDragging = false;
          peqDrag.bandIdx = -1;
          drawPeqCurve();
        }
      });

      cvs.addEventListener('wheel', (e) => {
        const pos = getCanvasEventPos(cvs, e);
        const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
        const hit = findHitBand(ch, pos.x, pos.y, pos.w, pos.h);
        if (hit !== -1) {
          e.preventDefault();
          const b = ch.peq[hit];
          const delta = (e.deltaY < 0 ? 0.1 : -0.1) * (e.shiftKey ? 0.02 : 1);
          let newQ = Math.round((b.q + delta) * 100) / 100;
          newQ = Math.max(0.3, Math.min(20.0, newQ));
          b.q = newQ;
          drawPeqCurve();
          updateBandInspectorControls(hit);
          throttledSetPath(`${activeChType}s.${activeChIdx}.peq.${hit}.q`, newQ);
        }
      }, { passive: false });
    }

    // ==========================================
    // INTERACTIVE CROSSOVER CANVAS & CONTROLS
    // ==========================================
    let xoverDrag = { isDragging: false, target: null };
    let xoverHoverTarget = null;

    function drawXoverCurve() {
      const cvs = document.getElementById('xover-canvas');
      if (!cvs) return;
      resizeCanvas(cvs);
      const ctx = cvs.getContext('2d');
      const w = cvs.offsetWidth;
      const h = cvs.offsetHeight;
      const ch = gState.outs[activeChIdx];
      if (!ch || !ch.xover) return;

      drawGrid(ctx, w, h, -60, 6);

      // 1. Calculate combined curve
      const curvePoints = [];
      for (let px = 0; px <= w; px += 2) {
        const f = 20 * Math.pow(10, (3 * px) / w);
        let db = 0;

        // HPF
        if (ch.xover.hp.on && ch.xover.hp.type > 0) {
          const ratio = ch.xover.hp.f / f;
          const ty = ch.xover.hp.type;
          if (ty === 1) db += -10 * Math.log10(1 + Math.pow(ratio, 4));
          else if (ty === 2) db += -10 * Math.log10(1 + Math.pow(ratio, 6));
          else if (ty === 3) db += -10 * Math.log10(1 + Math.pow(ratio, 8));
          else if (ty === 4) db += -20 * Math.log10(1 + Math.pow(ratio, 2));
          else if (ty === 5) db += -20 * Math.log10(1 + Math.pow(ratio, 4));
        }

        // LPF
        if (ch.xover.lp.on && ch.xover.lp.type > 0) {
          const ratio = f / ch.xover.lp.f;
          const ty = ch.xover.lp.type;
          if (ty === 1) db += -10 * Math.log10(1 + Math.pow(ratio, 4));
          else if (ty === 2) db += -10 * Math.log10(1 + Math.pow(ratio, 6));
          else if (ty === 3) db += -10 * Math.log10(1 + Math.pow(ratio, 8));
          else if (ty === 4) db += -20 * Math.log10(1 + Math.pow(ratio, 2));
          else if (ty === 5) db += -20 * Math.log10(1 + Math.pow(ratio, 4));
        }

        if (db < -60) db = -60;
        if (db > 6) db = 6;
        const y = h - ((db + 60) / 66) * h;
        curvePoints.push({ x: px, y: y });
      }

      // 2. Passband gradient fill
      if (curvePoints.length > 0) {
        ctx.beginPath();
        ctx.moveTo(0, h);
        curvePoints.forEach(pt => ctx.lineTo(pt.x, pt.y));
        ctx.lineTo(w, h);
        ctx.closePath();
        const fillGrad = ctx.createLinearGradient(0, 0, 0, h);
        fillGrad.addColorStop(0, 'rgba(255, 145, 0, 0.2)');
        fillGrad.addColorStop(1, 'rgba(0, 0, 0, 0.05)');
        ctx.fillStyle = fillGrad;
        ctx.fill();
      }

      // 3. Stroke main curve
      ctx.beginPath();
      ctx.strokeStyle = '#ff9100';
      ctx.lineWidth = 2.5;
      curvePoints.forEach((pt, idx) => {
        if (idx === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();

      // 4. Draw HPF Handle and Line
      if (ch.xover.hp.on && ch.xover.hp.f) {
        const hpx = freqToPos(ch.xover.hp.f, w);
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = '#00e676';
        ctx.lineWidth = 1.5;
        ctx.moveTo(hpx, 0);
        ctx.lineTo(hpx, h);
        ctx.stroke();
        ctx.setLineDash([]);

        // Handle Badge
        ctx.fillStyle = '#00e676';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(hpx - 34, 10, 68, 20, 4) : ctx.rect(hpx - 34, 10, 68, 20);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`HP ${ch.xover.hp.f >= 1000 ? (ch.xover.hp.f/1000).toFixed(1) + 'k' : ch.xover.hp.f + 'Hz'}`, hpx, 20);
      }

      // 5. Draw LPF Handle and Line
      if (ch.xover.lp.on && ch.xover.lp.f) {
        const lpx = freqToPos(ch.xover.lp.f, w);
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = '#ff9100';
        ctx.lineWidth = 1.5;
        ctx.moveTo(lpx, 0);
        ctx.lineTo(lpx, h);
        ctx.stroke();
        ctx.setLineDash([]);

        // Handle Badge
        ctx.fillStyle = '#ff9100';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(lpx - 34, 34, 68, 20, 4) : ctx.rect(lpx - 34, 34, 68, 20);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`LP ${ch.xover.lp.f >= 1000 ? (ch.xover.lp.f/1000).toFixed(1) + 'k' : ch.xover.lp.f + 'Hz'}`, lpx, 44);
      }
    }

    function setupXoverCanvasInteraction() {
      const cvs = document.getElementById('xover-canvas');
      if (!cvs || cvs.dataset.eventsAttached) return;
      cvs.dataset.eventsAttached = "true";

      cvs.addEventListener('mousedown', (e) => {
        const pos = getCanvasEventPos(cvs, e);
        const ch = gState.outs[activeChIdx];
        if (!ch || !ch.xover) return;
        const hpx = freqToPos(ch.xover.hp.f, pos.w);
        const lpx = freqToPos(ch.xover.lp.f, pos.w);

        if (Math.abs(pos.x - hpx) <= 20) {
          xoverDrag.isDragging = true;
          xoverDrag.target = 'hp';
        } else if (Math.abs(pos.x - lpx) <= 20) {
          xoverDrag.isDragging = true;
          xoverDrag.target = 'lp';
        }
      });

      window.addEventListener('mousemove', (e) => {
        const cvs = document.getElementById('xover-canvas');
        if (!cvs) return;
        const pos = getCanvasEventPos(cvs, e);
        const ch = gState.outs[activeChIdx];
        if (!ch || !ch.xover) return;

        if (xoverDrag.isDragging && xoverDrag.target) {
          const f = posToFreq(pos.x, pos.w);
          ch.xover[xoverDrag.target].f = f;
          if (!ch.xover[xoverDrag.target].on) {
            ch.xover[xoverDrag.target].on = true;
            if (ch.xover[xoverDrag.target].type === 0) ch.xover[xoverDrag.target].type = 1;
          }
          drawXoverCurve();
          updateXoverControls();
          throttledSetPath(`outs.${activeChIdx}.xover.${xoverDrag.target}.f`, f);
        } else {
          const hpx = freqToPos(ch.xover.hp.f, pos.w);
          const lpx = freqToPos(ch.xover.lp.f, pos.w);
          const hit = (Math.abs(pos.x - hpx) <= 20) ? 'hp' : (Math.abs(pos.x - lpx) <= 20) ? 'lp' : null;
          if (hit !== xoverHoverTarget) {
            xoverHoverTarget = hit;
            cvs.style.cursor = hit ? 'col-resize' : 'crosshair';
          }
        }
      });

      window.addEventListener('mouseup', () => {
        if (xoverDrag.isDragging && xoverDrag.target) {
          const ch = gState.outs[activeChIdx];
          setPath(`outs.${activeChIdx}.xover.${xoverDrag.target}.f`, ch.xover[xoverDrag.target].f);
          xoverDrag.isDragging = false;
          xoverDrag.target = null;
          drawXoverCurve();
        }
      });

      cvs.addEventListener('touchstart', (e) => {
        const pos = getCanvasEventPos(cvs, e);
        const ch = gState.outs[activeChIdx];
        if (!ch || !ch.xover) return;
        const hpx = freqToPos(ch.xover.hp.f, pos.w);
        const lpx = freqToPos(ch.xover.lp.f, pos.w);

        if (Math.abs(pos.x - hpx) <= 24) {
          if (e.cancelable) e.preventDefault();
          xoverDrag.isDragging = true;
          xoverDrag.target = 'hp';
        } else if (Math.abs(pos.x - lpx) <= 24) {
          if (e.cancelable) e.preventDefault();
          xoverDrag.isDragging = true;
          xoverDrag.target = 'lp';
        }
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        if (xoverDrag.isDragging && xoverDrag.target) {
          if (e.cancelable) e.preventDefault();
          const cvs = document.getElementById('xover-canvas');
          if (!cvs) return;
          const pos = getCanvasEventPos(cvs, e);
          const ch = gState.outs[activeChIdx];
          const f = posToFreq(pos.x, pos.w);
          ch.xover[xoverDrag.target].f = f;
          if (!ch.xover[xoverDrag.target].on) {
            ch.xover[xoverDrag.target].on = true;
            if (ch.xover[xoverDrag.target].type === 0) ch.xover[xoverDrag.target].type = 1;
          }
          drawXoverCurve();
          updateXoverControls();
          throttledSetPath(`outs.${activeChIdx}.xover.${xoverDrag.target}.f`, f);
        }
      }, { passive: false });

      window.addEventListener('touchend', () => {
        if (xoverDrag.isDragging && xoverDrag.target) {
          const ch = gState.outs[activeChIdx];
          setPath(`outs.${activeChIdx}.xover.${xoverDrag.target}.f`, ch.xover[xoverDrag.target].f);
          xoverDrag.isDragging = false;
          xoverDrag.target = null;
          drawXoverCurve();
        }
      });
    }

    function onXoverLogSlider(sec, val) {
      const f = logSliderToFreq(val);
      const ch = gState.outs[activeChIdx];
      ch.xover[sec].f = f;
      if (!ch.xover[sec].on) {
        ch.xover[sec].on = true;
        if (ch.xover[sec].type === 0) ch.xover[sec].type = 1;
      }
      drawXoverCurve();
      updateXoverControls();
      throttledSetPath(`outs.${activeChIdx}.xover.${sec}.f`, f);
    }

    function stepXoverFreq(sec, delta) {
      const ch = gState.outs[activeChIdx];
      const f = Math.max(20, Math.min(20000, ch.xover[sec].f + delta));
      ch.xover[sec].f = f;
      drawXoverCurve();
      updateXoverControls();
      setPath(`outs.${activeChIdx}.xover.${sec}.f`, f);
    }

    function selectXoverSlope(sec, type) {
      const ch = gState.outs[activeChIdx];
      type = parseInt(type);
      ch.xover[sec].type = type;
      ch.xover[sec].on = (type > 0);
      let slope = 0;
      if (type === 1 || type === 4) slope = 12;
      else if (type === 2) slope = 18;
      else if (type === 3 || type === 5) slope = 24;
      ch.xover[sec].slope = slope;

      drawXoverCurve();
      updateXoverControls();
      setPath(`outs.${activeChIdx}.xover.${sec}.type`, type);
      setPath(`outs.${activeChIdx}.xover.${sec}.slope`, slope);
      setPath(`outs.${activeChIdx}.xover.${sec}.on`, type > 0 ? 1 : 0);
    }

    function toggleXoverHp(on) {
      const ch = gState.outs[activeChIdx];
      ch.xover.hp.on = on;
      if (on && ch.xover.hp.type === 0) ch.xover.hp.type = 1;
      else if (!on) ch.xover.hp.type = 0;
      drawXoverCurve();
      updateXoverControls();
      setPath(`outs.${activeChIdx}.xover.hp.on`, on ? 1 : 0);
      setPath(`outs.${activeChIdx}.xover.hp.type`, ch.xover.hp.type);
    }

    function toggleXoverLp(on) {
      const ch = gState.outs[activeChIdx];
      ch.xover.lp.on = on;
      if (on && ch.xover.lp.type === 0) ch.xover.lp.type = 1;
      else if (!on) ch.xover.lp.type = 0;
      drawXoverCurve();
      updateXoverControls();
      setPath(`outs.${activeChIdx}.xover.lp.on`, on ? 1 : 0);
      setPath(`outs.${activeChIdx}.xover.lp.type`, ch.xover.lp.type);
    }

    function updateXoverControls() {
      const ch = gState.outs[activeChIdx];
      if (!ch || !ch.xover) return;

      const hpfVal = document.getElementById('xover-hp-f-val');
      const hpfSl = document.getElementById('xover-hp-f-sl');
      const hpfTog = document.getElementById('xover-hp-toggle');
      const hpfSt = document.getElementById('xover-hp-state');

      if (hpfVal) hpfVal.textContent = `${ch.xover.hp.f} Hz`;
      if (hpfSl && document.activeElement !== hpfSl) hpfSl.value = freqToLogSlider(ch.xover.hp.f);
      if (hpfTog) hpfTog.checked = ch.xover.hp.on;
      if (hpfSt) hpfSt.textContent = ch.xover.hp.on ? 'ON' : 'OFF';

      const lpfVal = document.getElementById('xover-lp-f-val');
      const lpfSl = document.getElementById('xover-lp-f-sl');
      const lpfTog = document.getElementById('xover-lp-toggle');
      const lpfSt = document.getElementById('xover-lp-state');

      if (lpfVal) lpfVal.textContent = `${ch.xover.lp.f} Hz`;
      if (lpfSl && document.activeElement !== lpfSl) lpfSl.value = freqToLogSlider(ch.xover.lp.f);
      if (lpfTog) lpfTog.checked = ch.xover.lp.on;
      if (lpfSt) lpfSt.textContent = ch.xover.lp.on ? 'ON' : 'OFF';

      // HUD
      const hudHpf = document.getElementById('hud-hpf-val');
      const hudLpf = document.getElementById('hud-lpf-val');
      if (hudHpf) hudHpf.textContent = ch.xover.hp.on ? `${ch.xover.hp.f} Hz [${FT_NAMES[ch.xover.hp.type]}]` : 'OFF';
      if (hudLpf) hudLpf.textContent = ch.xover.lp.on ? `${ch.xover.lp.f} Hz [${FT_NAMES[ch.xover.lp.type]}]` : 'OFF';
    }

    // ==========================================
    // DETAIL GAIN, DELAY, & DYNAMICS SLIDER HANDLERS
    // ==========================================
    function onDetailGainSlider(val) {
      const v = parseFloat(val);
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      ch.gain = v;
      document.getElementById('detail-gain-val').textContent = `${v >= 0 ? '+' : ''}${v.toFixed(1)} dB`;
      throttledSetPath(`${activeChType}s.${activeChIdx}.gain`, v);
    }

    function stepDetailGain(delta) {
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      let v = Math.round((ch.gain + delta) * 10) / 10;
      v = Math.max(-60, Math.min(12, v));
      ch.gain = v;
      const sl = document.getElementById('detail-gain-sl');
      if (sl) sl.value = v;
      document.getElementById('detail-gain-val').textContent = `${v >= 0 ? '+' : ''}${v.toFixed(1)} dB`;
      setPath(`${activeChType}s.${activeChIdx}.gain`, v);
    }

    function onDetailDelaySlider(val) {
      const v = parseFloat(val);
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      ch.delay = v;
      document.getElementById('detail-delay-val').textContent = `${v.toFixed(1)} ms`;
      document.getElementById('detail-delay-dist').textContent = `${(v * 0.343).toFixed(2)} m / ${(v * 1.1253).toFixed(2)} ft`;
      throttledSetPath(`${activeChType}s.${activeChIdx}.delay`, v);
    }

    function stepDetailDelay(delta) {
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      let v = Math.round((ch.delay + delta) * 10) / 10;
      v = Math.max(0, Math.min(300, v));
      ch.delay = v;
      const sl = document.getElementById('detail-delay-sl');
      if (sl) sl.value = v;
      document.getElementById('detail-delay-val').textContent = `${v.toFixed(1)} ms`;
      document.getElementById('detail-delay-dist').textContent = `${(v * 0.343).toFixed(2)} m / ${(v * 1.1253).toFixed(2)} ft`;
      setPath(`${activeChType}s.${activeChIdx}.delay`, v);
    }

    function onGateParamSlider(param, val) {
      const v = parseFloat(val);
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      ch.gate[param] = v;
      const valEl = document.getElementById(`gate-${param}-val`);
      if (valEl) valEl.textContent = `${v} dB`;
      throttledSetPath(`${activeChType}s.${activeChIdx}.gate.${param}`, v);
    }

    function stepGateParam(param, delta) {
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      let v = Math.round(ch.gate[param] + delta);
      v = Math.max(-80, Math.min(0, v));
      ch.gate[param] = v;
      const sl = document.getElementById(`gate-${param}-sl`);
      if (sl) sl.value = v;
      const valEl = document.getElementById(`gate-${param}-val`);
      if (valEl) valEl.textContent = `${v} dB`;
      setPath(`${activeChType}s.${activeChIdx}.gate.${param}`, v);
    }

    function onLimParamSlider(param, val) {
      const v = parseFloat(val);
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      ch.lim[param] = v;
      const valEl = document.getElementById(`lim-${param}-val`);
      if (valEl) valEl.textContent = `${v >= 0 ? '+' : ''}${v.toFixed(1)} dB`;
      throttledSetPath(`${activeChType}s.${activeChIdx}.lim.${param}`, v);
    }

    function stepLimParam(param, delta) {
      const ch = activeChType === 'in' ? gState.ins[activeChIdx] : gState.outs[activeChIdx];
      let v = Math.round((ch.lim[param] + delta) * 10) / 10;
      v = Math.max(-40, Math.min(12, v));
      ch.lim[param] = v;
      const sl = document.getElementById(`lim-${param}-sl`);
      if (sl) sl.value = v;
      const valEl = document.getElementById(`lim-${param}-val`);
      if (valEl) valEl.textContent = `${v >= 0 ? '+' : ''}${v.toFixed(1)} dB`;
      setPath(`${activeChType}s.${activeChIdx}.lim.${param}`, v);
    }
  </script>
