<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DLMS 2x4 PRO | Digital Loudspeaker Management System</title>
  <style>
    :root {
      --bg-dark: #050b14;
      --bg-card: #091524;
      --bg-card-sub: #0d1e33;
      --bg-input: #07101b;
      --border: #13334d;
      --border-focus: #00d2f0;
      --text-main: #f0f6fc;
      --text-muted: #7996aa;
      --text-dim: #446074;
      --cyan: #00d2f0;
      --cyan-glow: rgba(0, 210, 240, 0.35);
      --orange: #ff9100;
      --orange-glow: rgba(255, 145, 0, 0.35);
      --green: #00e676;
      --red: #ff1744;
      --yellow: #ffd600;
      --blue: #2979ff;
      --purple: #d500f9;
      --font-mono: 'Consolas', 'Courier New', ui-monospace, monospace;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
    }

    /* TOP HEADER */
    header {
      background: linear-gradient(180deg, #091829 0%, #06111f 100%);
      border-bottom: 2px solid var(--border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .brand-wrap { display: flex; align-items: center; gap: 12px; }
    .brand-title {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-badge {
      background: var(--cyan);
      color: #000;
      font-size: 10px;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 3px;
      letter-spacing: 0.5px;
    }
    .header-info { display: flex; align-items: center; gap: 14px; font-family: var(--font-mono); font-size: 11px; }
    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-muted);
    }
    .badge.connected { border-color: var(--green); color: var(--green); }
    .badge.disconnected { border-color: var(--red); color: var(--red); }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
    }
    .connected .status-dot { background: var(--green); box-shadow: 0 0 8px var(--green); }

    /* RTA SPECTRUM SECTION */
    .rta-container {
      background: #040910;
      border-bottom: 1px solid var(--border);
      padding: 4px 14px;
      height: 74px;
      flex-shrink: 0;
      position: relative;
    }
    .rta-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 2px;
    }
    #rta-canvas {
      width: 100%;
      height: 52px;
      display: block;
      border-radius: 2px;
    }

    /* NAVIGATION TABS */
    nav.tabs-nav {
      background: #071322;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 2px;
      padding: 4px 10px 0;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .tab-btn {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 16px;
      cursor: pointer;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      border-bottom: 3px solid transparent;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .tab-btn:hover { color: #fff; background: rgba(0, 210, 240, 0.05); }
    .tab-btn.active {
      color: #fff;
      background: var(--bg-card);
      border-bottom: 3px solid var(--cyan);
      box-shadow: 0 -2px 10px rgba(0, 210, 240, 0.15);
    }
    .tab-btn.active.out-tab { border-bottom-color: var(--orange); }
    .tab-btn.active.sys-tab { border-bottom-color: var(--purple); }

    /* VIEW CONTAINER */
    main.content-view {
      flex: 1;
      overflow-y: auto;
      background-color: var(--bg-dark);
      padding: 14px;
      position: relative;
    }
    .view-page { display: none; height: 100%; }
    .view-page.active { display: flex; flex-direction: column; gap: 14px; }

    /* DASHBOARD GRID */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      height: 100%;
      min-height: 480px;
    }
    @media (max-width: 1024px) {
      .dashboard-grid { grid-template-columns: repeat(3, 1fr); height: auto; }
      body { overflow-y: auto; }
    }
    @media (max-width: 640px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    /* CHANNEL STRIP */
    .strip-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      position: relative;
    }
    .strip-card.in-strip { border-top: 3px solid var(--cyan); }
    .strip-card.out-strip { border-top: 3px solid var(--orange); }
    .strip-header {
      padding: 8px 10px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .strip-name {
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .strip-route-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      background: var(--bg-card-sub);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 3px;
      color: var(--cyan);
    }
    .strip-body {
      flex: 1;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: space-between;
    }

    /* METERS ROW */
    .meters-row {
      display: flex;
      gap: 8px;
      height: 180px;
      align-items: stretch;
      justify-content: center;
      background: #040a12;
      border: 1px solid #0e2235;
      border-radius: 6px;
      padding: 6px;
    }
    .meter-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      height: 100%;
    }
    .meter-caption {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .meter-track {
      flex: 1;
      width: 14px;
      background: #081420;
      border: 1px solid #14324c;
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }
    .meter-bar {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(0deg, var(--green) 0%, var(--green) 70%, var(--yellow) 85%, var(--red) 100%);
      transition: height 0.05s ease-out;
    }
    .meter-peak-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: #fff;
      bottom: 0%;
      box-shadow: 0 0 4px #fff;
    }
    .meter-gr-track {
      flex: 1;
      width: 10px;
      background: #081420;
      border: 1px solid #14324c;
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }
    .meter-gr-bar {
      position: absolute;
      top: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, var(--yellow) 0%, var(--red) 100%);
      transition: height 0.05s ease-out;
    }
    .gr-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2b0b11;
      border: 1px solid #5c1825;
      transition: all 0.1s ease;
    }
    .gr-led.active {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
      border-color: #ff859c;
    }
    .meter-db-readout {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* GAIN SLIDER CONTROL */
    .gain-ctl-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--bg-card-sub);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .gain-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
    }
    .gain-val-badge {
      font-size: 13px;
      font-weight: 800;
      color: var(--cyan);
    }
    .out-strip .gain-val-badge { color: var(--orange); }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-step {
      background: #0f263e;
      border: 1px solid var(--border);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      width: 22px;
      height: 22px;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-step:hover { background: var(--cyan); color: #000; }
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
      cursor: pointer;
    }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track {
      height: 6px;
      background: #050d17;
      border: 1px solid #143550;
      border-radius: 3px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 6px var(--cyan-glow);
      margin-top: -5px;
      border: 2px solid #fff;
    }
    .out-strip input[type=range]::-webkit-slider-thumb {
      background: var(--orange);
      box-shadow: 0 0 6px var(--orange-glow);
    }

    /* DSP CHIPS ROW */
    .dsp-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }
    .chip {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 3px;
      background: #081524;
      border: 1px solid #11283d;
      color: var(--text-dim);
    }
    .chip.active {
      color: #fff;
      border-color: var(--cyan);
      background: rgba(0, 210, 240, 0.15);
    }
    .chip.active.out-chip {
      border-color: var(--orange);
      background: rgba(255, 145, 0, 0.15);
    }

    /* STRIP ACTION BUTTONS */
    .strip-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      padding: 7px 4px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #081626;
      color: var(--text-muted);
      text-align: center;
      transition: all 0.15s ease;
    }
    .btn-pill:hover { border-color: #fff; color: #fff; }
    .btn-pill.muted {
      background: rgba(255, 23, 68, 0.2);
      border-color: var(--red);
      color: var(--red);
      box-shadow: 0 0 10px rgba(255, 23, 68, 0.3);
    }
    .btn-pill.inverted {
      background: rgba(255, 145, 0, 0.2);
      border-color: var(--orange);
      color: var(--orange);
    }
    
    /* INPUTS AND SELECTS */
    .input-num {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 4px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .input-num:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 8px var(--cyan-glow);
    }
    .select-ctl {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 4px;
      width: 100%;
      outline: none;
      appearance: none;
      cursor: pointer;
    }
    .select-ctl:focus {
      border-color: var(--cyan);
    }
    
    /* TOGGLE SWITCH */
    .switch-label {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider-toggle {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #07101b;
      border: 1px solid var(--border);
      transition: .2s;
      border-radius: 24px;
    }
    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: var(--text-muted);
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider-toggle {
      background-color: rgba(0, 210, 240, 0.2);
      border-color: var(--cyan);
    }
    input:checked + .slider-toggle:before {
      transform: translateX(20px);
      background-color: var(--cyan);
      box-shadow: 0 0 8px var(--cyan-glow);
    }
    .btn-edit-ch {
      grid-column: span 2;
      background: #0d2742;
      border: 1px solid var(--border);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-edit-ch:hover {
      background: var(--cyan);
      color: #000;
      border-color: var(--cyan);
      box-shadow: 0 0 12px var(--cyan-glow);
    }
    .out-strip .btn-edit-ch:hover {
      background: var(--orange);
      border-color: var(--orange);
      box-shadow: 0 0 12px var(--orange-glow);
    }

    /* CHANNEL DETAIL VIEW LAYOUT */
    .detail-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .detail-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .card-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .card-title {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-actions { display: flex; gap: 8px; align-items: center; }

    /* TOGGLE SWITCH */
    .switch-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 18px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #091a2b;
      border: 1px solid #143552;
      transition: .2s;
      border-radius: 18px;
    }
    .slider-toggle:before {
      position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px;
      background-color: var(--text-muted);
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider-toggle {
      background-color: var(--cyan);
      border-color: var(--cyan);
      box-shadow: 0 0 8px var(--cyan-glow);
    }
    input:checked + .slider-toggle:before {
      transform: translateX(16px);
      background-color: #000;
    }

    /* GRAPH CANVASES & HUD TOOLTIP */
    .graph-box {
      width: 100%;
      height: 250px;
      background: #040912;
      border: 1px solid #0f273d;
      border-radius: 8px;
      position: relative;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: inset 0 2px 12px rgba(0,0,0,0.7);
      touch-action: none;
    }
    .graph-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .graph-hud {
      position: absolute;
      top: 8px;
      right: 12px;
      background: rgba(5, 14, 25, 0.88);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--cyan);
      backdrop-filter: blur(6px);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }
    .graph-hud span { color: var(--text-muted); }
    .graph-hud b { color: #fff; }

    /* STUDIO ACTIVE BAND STRIP */
    .band-inspector-bar {
      background: var(--bg-card-sub);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .band-pills-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 10px;
    }
    .band-selector-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .band-pill-btn {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #061220;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .band-pill-btn:hover {
      border-color: #fff;
      color: #fff;
    }
    .band-pill-btn.active {
      background: #0e2942;
      border-color: var(--cyan);
      color: #fff;
      box-shadow: 0 0 10px var(--cyan-glow);
    }
    .band-pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .type-pills-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .type-pill-btn {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: #081524;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .type-pill-btn:hover { color: #fff; border-color: var(--text-muted); }
    .type-pill-btn.active {
      background: rgba(0, 210, 240, 0.2);
      border-color: var(--cyan);
      color: var(--cyan);
      font-weight: 800;
    }

    /* TACTILE SLIDER CLUSTERS */
    .studio-sliders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }
    .studio-slider-box {
      background: #071322;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .slider-box-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .slider-box-title {
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.5px;
    }
    .slider-box-value {
      color: var(--cyan);
      font-weight: 800;
      font-size: 13px;
    }
    .slider-control-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stepper-btn-group {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .btn-step-sm {
      background: #0b2238;
      border: 1px solid var(--border);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 3px;
      cursor: pointer;
      line-height: 1;
      transition: all 0.1s ease;
    }
    .btn-step-sm:hover {
      background: var(--cyan);
      color: #000;
      border-color: var(--cyan);
    }
    .slope-pills-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .slope-pill {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: #081524;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .slope-pill:hover { color: #fff; border-color: var(--text-muted); }
    .slope-pill.active {
      background: rgba(0, 230, 118, 0.2);
      border-color: var(--green);
      color: var(--green);
      font-weight: 800;
    }
    .slope-pill.active.lpf {
      background: rgba(255, 145, 0, 0.2);
      border-color: var(--orange);
      color: var(--orange);
      font-weight: 800;
    }

    /* FORMS & PARAMETER GRIDS */
    .param-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .param-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--bg-card-sub);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .param-item label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .param-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-num {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 8px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
    }
    .input-num:focus { outline: none; border-color: var(--cyan); }
    .select-ctl {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 8px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .select-ctl:focus { outline: none; border-color: var(--cyan); }

    /* PEQ TABLE */
    .peq-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    table.peq-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 11px;
    }
    table.peq-table th {
      background: #0a1c2e;
      padding: 8px;
      text-align: left;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    table.peq-table td {
      padding: 6px 8px;
      border-bottom: 1px solid #0c2033;
    }
    table.peq-table tr:hover { background: rgba(0, 210, 240, 0.03); }

    /* SYSTEM & PRESET STYLING */
    .system-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }
    .preset-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--bg-card-sub);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .preset-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
    }
    .btn-action {
      background: #0f2742;
      border: 1px solid var(--border);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-action:hover { border-color: var(--cyan); color: var(--cyan); }
    .btn-action.btn-save:hover { border-color: var(--green); color: var(--green); }
    .btn-action.btn-danger {
      border-color: var(--red);
      color: var(--red);
    }
    .btn-action.btn-danger:hover {
      background: var(--red);
      color: #fff;
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: #13334d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand-wrap">
      <div class="brand-title">
        <span>DLMS</span>
        <span class="brand-badge">2x4 PRO</span>
      </div>
      <div id="device-title" style="font-family:var(--font-mono); color:var(--text-muted); font-size:12px;">DLMS 240 PRO</div>
    </div>

    <div class="header-info">
      <div class="badge" id="ws-badge">
        <div class="status-dot"></div>
        <span id="ws-text">DISCONNECTED</span>
      </div>
      <div class="badge">
        <span>FS:</span> <strong style="color:#fff;" id="fs-text">48 kHz</strong>
      </div>
      <div class="badge">
        <span>IP:</span> <strong style="color:var(--cyan);" id="ip-text">192.168.4.1</strong>
      </div>
      <button class="btn-action btn-danger" onclick="confirmResetAll()" style="padding:4px 8px; font-size:10px;">RESET FLAT</button>
    </div>
  </header>

  <!-- REAL-TIME RTA SPECTRUM ANALYZER -->
  <div class="rta-container">
    <div class="rta-header">
      <span>REAL-TIME SPECTRUM ANALYZER (RTA 32-BAND)</span>
      <span>20 Hz — 20 kHz (ADC INPUT MASTER)</span>
    </div>
    <canvas id="rta-canvas"></canvas>
  </div>

  <!-- NAVIGATION TABS -->
  <nav class="tabs-nav" id="main-tabs">
    <button class="tab-btn active" data-view="dashboard">OVERVIEW</button>
    <button class="tab-btn" data-view="in-0">IN 1 (L)</button>
    <button class="tab-btn" data-view="in-1">IN 2 (R)</button>
    <button class="tab-btn out-tab" data-view="out-0">OUT 1</button>
    <button class="tab-btn out-tab" data-view="out-1">OUT 2</button>
    <button class="tab-btn out-tab" data-view="out-2">OUT 3</button>
    <button class="tab-btn out-tab" data-view="out-3">OUT 4</button>
    <button class="tab-btn sys-tab" data-view="system">PRESETS & SYSTEM</button>
  </nav>

  <!-- MAIN CONTENT AREA -->
  <main class="content-view">

    <!-- 1. DASHBOARD VIEW (6 CHANNEL STRIPS) -->
    <section class="view-page active" id="view-dashboard">
      <div class="dashboard-grid" id="strips-container">
        <!-- Rendered dynamically via renderDashboard() -->
      </div>
    </section>

    <!-- 2. CHANNEL DETAIL VIEW (INPUT & OUTPUT) -->
    <section class="view-page" id="view-channel-detail">
      <div class="detail-container" id="channel-detail-body">
        <!-- Rendered dynamically via renderChannelDetail() -->
      </div>
    </section>

    <!-- 3. PRESETS & SYSTEM VIEW -->
    <section class="view-page" id="view-system">
      <div class="system-grid">
        
        <!-- PRESETS CARD -->
        <div class="detail-card">
          <div class="card-title-row">
            <div class="card-title">USER PRESETS MEMORY</div>
          </div>
          <div id="presets-list">
            <!-- 5 Presets generated by JS -->
          </div>
        </div>

        <!-- HARDWARE LCD SCREEN CONTROL -->
        <div class="detail-card">
          <div class="card-title-row">
            <div class="card-title">HARDWARE LCD & DISPLAY</div>
          </div>
          <div class="param-grid" style="grid-template-columns: 1fr;">
            <div class="param-item">
              <div style="display:flex; justify-content:space-between;">
                <label>LCD BACKLIGHT BRIGHTNESS</label>
                <span id="lcd-br-val" style="font-family:var(--font-mono); font-weight:800; color:var(--cyan);">80%</span>
              </div>
              <input type="range" id="lcd-br-slider" min="10" max="100" value="80" oninput="onLcdBrightness(this.value)">
            </div>
            <div class="param-item">
              <label>LCD AUTO-OFF TIMEOUT</label>
              <select class="select-ctl" id="lcd-timeout-sel" onchange="onLcdTimeout(this.value)">
                <option value="0">ALWAYS ON (No Sleep)</option>
                <option value="1">1 MINUTE</option>
                <option value="2">2 MINUTES (Default)</option>
                <option value="5">5 MINUTES</option>
                <option value="10">10 MINUTES</option>
                <option value="15">15 MINUTES</option>
                <option value="30">30 MINUTES</option>
              </select>
            </div>
          </div>
        </div>

        <!-- WI-FI & NETWORK CARD -->
        <div class="detail-card">
          <div class="card-title-row">
            <div class="card-title">NETWORK & WI-FI CONFIG</div>
          </div>
          <div class="param-grid" style="grid-template-columns: 1fr;">
            <div class="param-item">
              <label>WI-FI RADIO ENABLE</label>
              <label class="switch-label">
                <div class="switch">
                  <input type="checkbox" id="wifi-on-toggle" onchange="onWifiToggle(this.checked)">
                  <span class="slider-toggle"></span>
                </div>
                <span id="wifi-state-text">ENABLED</span>
              </label>
            </div>
            <div class="param-item">
              <label>WI-FI MODE</label>
              <select class="select-ctl" id="wifi-mode-sel" onchange="onWifiMode(this.value)">
                <option value="AP">ACCESS POINT (Standalone Hotspot)</option>
                <option value="CLIENT">CLIENT (Join Existing Network)</option>
              </select>
            </div>
            <div class="param-item">
              <label>WI-FI PASSWORD (Min 8 chars for WPA2)</label>
              <input type="text" class="input-num" id="wifi-pw-input" placeholder="Password..." onchange="onWifiPw(this.value)">
            </div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <script>
    /* ==========================================================================
       DLMS 2x4 PRO — Web Audio Console Client
       Full Two-Way Bidirectional Realtime Sync with LCD Hardware
       ========================================================================== */

    let gState = null;
    let ws = null;
    let reconnectInterval = null;
    let currentTab = 'dashboard';
    let activeChType = 'in'; // 'in' or 'out'
    let activeChIdx = 0;

    const PEQ_COLORS = [
      '#00e5ff', '#ff9100', '#ffd600', '#00e676', '#ff1744',
      '#7c4dff', '#00b0ff', '#ff3d00', '#ffea00', '#00e676',
      '#d500f9', '#1de9b6', '#ff5252', '#651fff', '#304ffe'
    ];

    const FT_NAMES = ["OFF", "BW 12dB", "BW 18dB", "BW 24dB", "LR 12dB", "LR 24dB"];
    const PEQ_TYPES = ["BELL (PEQ)", "LOW SHELF", "HIGH SHELF", "NOTCH", "ALLPASS", "LOWPASS", "HIGHPASS"];
    const SUBSONIC_FREQS = [0, 20, 25, 30, 40, 50, 60, 80, 100, 120, 150, 200];

    // ==========================================
    // INITIALIZATION & TAB NAVIGATION
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      initTabs();
      initRtaCanvas();
      connectWebSocket();
      fetchInitialState();
    });

    function initTabs() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const target = btn.dataset.view;
          currentTab = target;

          document.querySelectorAll('.view-page').forEach(p => p.classList.remove('active'));

          if (target === 'dashboard') {
            document.getElementById('view-dashboard').classList.add('active');
            renderDashboard();
          } else if (target === 'system') {
            document.getElementById('view-system').classList.add('active');
            renderSystem();
          } else if (target.startsWith('in-') || target.startsWith('out-')) {
            const parts = target.split('-');
            activeChType = parts[0];
            activeChIdx = parseInt(parts[1]);
            document.getElementById('view-channel-detail').classList.add('active');
            renderChannelDetail();
          }
        });
      });
    }

    function selectTab(viewTarget) {
      const btn = document.querySelector(`.tab-btn[data-view="${viewTarget}"]`);
      if (btn) btn.click();
    }

    // ==========================================
    // WEBSOCKET COMMUNICATIONS
    // ==========================================
    const wsQueue = [];

    function connectWebSocket() {
      if (ws) {
        try { ws.close(); } catch(e){}
      }
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${proto}//${location.host}/ws`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        const badge = document.getElementById('ws-badge');
        badge.className = 'badge connected';
        document.getElementById('ws-text').textContent = 'CONNECTED';
        if (reconnectInterval) { clearInterval(reconnectInterval); reconnectInterval = null; }
        // Request state
        ws.send(JSON.stringify({ type: 'get_state' }));
        // Flush any queued changes
        while (wsQueue.length > 0) {
          ws.send(wsQueue.shift());
        }
      };

      ws.onclose = () => {
        const badge = document.getElementById('ws-badge');
        badge.className = 'badge disconnected';
        document.getElementById('ws-text').textContent = 'DISCONNECTED';
        if (!reconnectInterval) {
          reconnectInterval = setInterval(connectWebSocket, 1500);
        }
      };

      ws.onerror = (e) => {
        console.warn("WebSocket error:", e);
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          handleWsMessage(msg);
        } catch (err) {
          console.error("JSON parse error:", err);
        }
      };
    }

    async function fetchInitialState() {
      try {
        const r = await fetch('/api/state');
        if (r.ok) {
          const data = await r.json();
          gState = data;
          updateStaticHeader();
          renderActiveView();
        }
      } catch (e) {
        console.log("Waiting for WebSocket state...", e);
      }
    }

    function handleWsMessage(msg) {
      if (msg.type === 'full_state' || msg.type === 'hello') {
        gState = msg;
        updateStaticHeader();
        renderActiveView();
      } else if (msg.type === 'change') {
        // Granular update from hardware LCD or another client!
        applyPathChange(msg.path, msg.value);
      } else if (msg.type === 'meter') {
        // Live meter update: vu[6], pre[6], gr[6], rta[32]
        renderLiveMeters(msg);
      }
    }

    function updateStaticHeader() {
      if (!gState) return;
      if (gState.device) document.getElementById('device-title').textContent = gState.device;
      if (gState.sampleRate) document.getElementById('fs-text').textContent = `${Math.round(gState.sampleRate / 1000)} kHz`;
      if (gState.ip) document.getElementById('ip-text').textContent = gState.ip;
    }

    // ==========================================
    // DISPATCHING VALUE CHANGES TO ESP32
    // ==========================================
    function setPath(path, value) {
      // 1. Update local cache immediately
      applyPathChange(path, value);

      // 2. Send via WebSocket for zero latency (or queue if disconnected)
      const numVal = (typeof value === 'boolean') ? (value ? 1 : 0) : parseFloat(value);
      const payload = JSON.stringify({
        type: 'set',
        path: path,
        value: isNaN(numVal) ? value : numVal
      });

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(payload);
      } else {
        wsQueue.push(payload);
      }
    }

    function applyPathChange(path, value) {
      if (!gState) return;
      const numVal = (typeof value === 'boolean') ? (value ? 1 : 0) : parseFloat(value);
      const v = isNaN(numVal) ? value : numVal;
      const parts = path.split('.');
      if (parts[0] === 'system') {
        if (parts[1] === 'brightness') gState.brightness = v;
        else if (parts[1] === 'lcdTimeout') gState.lcdTimeout = v;
      } else if (parts[0] === 'ins' || parts[0] === 'outs') {
        const arr = parts[0] === 'ins' ? gState.ins : gState.outs;
        const chIdx = parseInt(parts[1]);
        if (!arr || !arr[chIdx]) return;
        const ch = arr[chIdx];
        
        if (parts[2] === 'gain') ch.gain = v;
        else if (parts[2] === 'mute') ch.mute = (v > 0.5);
        else if (parts[2] === 'invert') ch.invert = (v > 0.5);
        else if (parts[2] === 'delay') ch.delay = v;
        else if (parts[2] === 'subsonic') ch.subsonic = v;
        else if (parts[2] === 'peqOn') ch.peqOn = (v > 0.5);
        else if (parts[2] === 'srcIn1') ch.srcIn1 = (v > 0.5);
        else if (parts[2] === 'srcIn2') ch.srcIn2 = (v > 0.5);
        else if (parts[2] === 'peq' && parts[4]) {
          const bIdx = parseInt(parts[3]);
          if (ch.peq && ch.peq[bIdx]) {
            ch.peq[bIdx][parts[4]] = (parts[4] === 'on') ? (v > 0.5) : v;
          }
        } else if (parts[2] === 'gate' && parts[3]) {
          ch.gate[parts[3]] = (parts[3] === 'on') ? (v > 0.5) : v;
        } else if (parts[2] === 'lim' && parts[3]) {
          ch.lim[parts[3]] = (parts[3] === 'on') ? (v > 0.5) : v;
        } else if (parts[2] === 'xover' && parts[4]) {
          const sec = parts[3]; // 'hp' or 'lp'
          ch.xover[sec][parts[4]] = (parts[4] === 'on') ? (v > 0.5) : v;
        }
      }

      // Sync active view UI elements without disrupting active focus
      syncUiElements(path, v);
    }

    function syncUiElements(path, value) {
      // Sync Dashboard elements
      if (currentTab === 'dashboard') {
        const parts = path.split('.');
        if (parts[0] === 'ins' || parts[0] === 'outs') {
          const type = parts[0] === 'ins' ? 'in' : 'out';
          const idx = parts[1];
          const prop = parts[2];
          if (prop === 'gain') {
            const sl = document.getElementById(`dash-gain-sl-${type}-${idx}`);
            const num = document.getElementById(`dash-gain-val-${type}-${idx}`);
            if (sl && document.activeElement !== sl) sl.value = value;
            if (num) num.textContent = `${value >= 0 ? '+' : ''}${parseFloat(value).toFixed(1)} dB`;
          } else if (prop === 'mute') {
            const btn = document.getElementById(`dash-mute-${type}-${idx}`);
            if (btn) {
              btn.className = `btn-pill ${value > 0.5 ? 'muted' : ''}`;
              btn.textContent = value > 0.5 ? 'MUTED' : 'MUTE';
            }
          } else if (prop === 'invert') {
            const btn = document.getElementById(`dash-phase-${type}-${idx}`);
            if (btn) {
              btn.className = `btn-pill ${value > 0.5 ? 'inverted' : ''}`;
              btn.textContent = value > 0.5 ? '180°' : '0°';
            }
          }
        }
      } else if (currentTab.startsWith('in-') || currentTab.startsWith('out-')) {
        const parts = path.split('.');
        const chType = parts[0] === 'ins' ? 'in' : 'out';
        const chIdx = parseInt(parts[1]);
        if (chType === activeChType && chIdx === activeChIdx) {
          if (parts[2] === 'gain') {
            const sl = document.getElementById('detail-gain-sl');
            const num = document.getElementById('detail-gain-val');
            if (sl && document.activeElement !== sl) sl.value = value;
            if (num) num.textContent = `${value >= 0 ? '+' : ''}${parseFloat(value).toFixed(1)} dB`;
          } else if (parts[2] === 'delay') {
            const sl = document.getElementById('detail-delay-sl');
            const num = document.getElementById('detail-delay-val');
            const dist = document.getElementById('detail-delay-dist');
            if (sl && document.activeElement !== sl) sl.value = value;
            if (num) num.textContent = `${parseFloat(value).toFixed(1)} ms`;
            if (dist) dist.textContent = `${(value * 0.343).toFixed(2)} m / ${(value * 1.1253).toFixed(2)} ft`;
          } else if (parts[2] === 'peq') {
            if (typeof drawPeqCurve === 'function') drawPeqCurve();
            const bIdx = parseInt(parts[3]);
            if (bIdx === selectedBandIdx && typeof updateBandInspectorControls === 'function') {
              updateBandInspectorControls(bIdx);
            }
          } else if (parts[2] === 'xover') {
            if (typeof drawXoverCurve === 'function') drawXoverCurve();
            if (typeof updateXoverControls === 'function') updateXoverControls();
          } else if (parts[2] === 'peqOn') {
            const tog = document.getElementById('peq-master-toggle');
            const st = document.getElementById('peq-master-state');
            if (tog) tog.checked = (value > 0.5);
            if (st) st.textContent = (value > 0.5) ? 'ACTIVE' : 'BYPASS';
            if (typeof drawPeqCurve === 'function') drawPeqCurve();
          }
        }
      }
    }

    function renderActiveView() {
      if (currentTab === 'dashboard') renderDashboard();
      else if (currentTab === 'system') renderSystem();
      else renderChannelDetail();
    }

    // ==========================================
    // VIEW 1: DASHBOARD RENDERER
    // ==========================================
    function renderDashboard() {
      if (!gState) return;
      const c = document.getElementById('strips-container');
      c.innerHTML = '';

      // 2 Inputs
      for (let i = 0; i < 2; i++) {
        c.appendChild(createChannelStrip('in', i, gState.ins[i]));
      }
      // 4 Outputs
      for (let i = 0; i < 4; i++) {
        c.appendChild(createChannelStrip('out', i, gState.outs[i]));
      }
    }

    function createChannelStrip(type, idx, ch) {
      const card = document.createElement('div');
      card.className = `strip-card ${type}-strip`;

      let routeText = '';
      if (type === 'out') {
        if (ch.srcIn1 && ch.srcIn2) routeText = 'IN 1+2 (L+R)';
        else if (ch.srcIn1) routeText = 'IN 1 (L)';
        else if (ch.srcIn2) routeText = 'IN 2 (R)';
        else routeText = 'NONE';
      }

      card.innerHTML = `
        <div class="strip-header">
          <span class="strip-name" style="color: ${type === 'in' ? 'var(--cyan)' : 'var(--orange)'}">
            ${type.toUpperCase()} ${idx + 1}
          </span>
          ${type === 'out' ? `<span class="strip-route-badge">${routeText}</span>` : `<span class="strip-route-badge" style="color:var(--text-dim)">ADC IN</span>`}
        </div>

        <div class="strip-body">
          
          <!-- METERS (PRE, POST, GR) -->
          <div class="meters-row">
            <!-- PRE VU -->
            <div class="meter-col">
              <span class="meter-caption">PRE</span>
              <div class="meter-track">
                <div class="meter-bar" id="m-bar-pre-${type}-${idx}"></div>
                <div class="meter-peak-line" id="m-peak-pre-${type}-${idx}"></div>
              </div>
              <span class="meter-db-readout" id="m-val-pre-${type}-${idx}">-80</span>
            </div>

            <!-- POST VU -->
            <div class="meter-col">
              <span class="meter-caption">POST</span>
              <div class="meter-track">
                <div class="meter-bar" id="m-bar-post-${type}-${idx}"></div>
                <div class="meter-peak-line" id="m-peak-post-${type}-${idx}"></div>
              </div>
              <span class="meter-db-readout" id="m-val-post-${type}-${idx}">-80</span>
            </div>

            <!-- LIMITER GR -->
            <div class="meter-col">
              <span class="meter-caption">GR</span>
              <div class="meter-gr-track">
                <div class="meter-gr-bar" id="m-bar-gr-${type}-${idx}"></div>
              </div>
              <div class="gr-led" id="m-led-gr-${type}-${idx}"></div>
              <span class="meter-db-readout" id="m-val-gr-${type}-${idx}">0</span>
            </div>
          </div>

          <div class="gain-ctl-wrap">
            <div class="gain-head">
              <span style="font-size:10px; color:var(--text-muted); font-weight:700;">GAIN</span>
              <span class="gain-val-badge" id="dash-gain-val-${type}-${idx}">
                ${ch.gain >= 0 ? '+' : ''}${ch.gain.toFixed(1)} dB

            </div>
            <div class="slider-row">
              <button class="btn-step" onclick="stepGain('${type}', ${idx}, -0.5)">-</button>

                     id="dash-gain-sl-${type}-${idx}"
                     oninput="onGainSlider('${type}', ${idx}, this.value)">

          </div>

          <div class="dsp-chips">
            <span class="chip ${ch.subsonic > 0 ? (type === 'in' ? 'active' : 'active out-chip') : ''}">SUB</span>
            <span class="chip ${ch.gate && ch.gate.on ? (type === 'in' ? 'active' : 'active out-chip') : ''}">GATE</span>
            <span class="chip ${ch.peqOn ? (type === 'in' ? 'active' : 'active out-chip') : ''}">PEQ</span>
            ${type === 'out' ? `<span class="chip ${ch.xover && (ch.xover.hp.on || ch.xover.lp.on) ? 'active out-chip' : ''}">XOVER</span>` : ''}

      return card;
    }

    function onGainSlider(type, idx, val) {
      const path = `${type}s.${idx}.gain`;
      document.getElementById(`dash-gain-val-${type}-${idx}`).textContent = `${val >= 0 ? '+' : ''}${parseFloat(val).toFixed(1)} dB`;
      setPath(path, val);
    }

    function stepGain(type, idx, delta) {
      const arr = type === 'in' ? gState.ins : gState.outs;
      let val = Math.round((arr[idx].gain + delta) * 10) / 10;
      if (val < -60) val = -60;
      if (val > 12) val = 12;
      const path = `${type}s.${idx}.gain`;
      setPath(path, val);
    }

    function toggleMute(type, idx) {
      const arr = type === 'in' ? gState.ins : gState.outs;
      const newVal = !arr[idx].mute;
      setPath(`${type}s.${idx}.mute`, newVal ? 1 : 0);
    }

    function togglePhase(type, idx) {
      const arr = type === 'in' ? gState.ins : gState.outs;
      const newVal = !arr[idx].invert;
      setPath(`${type}s.${idx}.invert`, newVal ? 1 : 0);
    }

    // ==========================================
    // REAL-TIME METERS & RTA CANVAS ENGINE
    // ==========================================
    let rtaCtx = null;
    let rtaCanvas = null;

    function initRtaCanvas() {
      rtaCanvas = document.getElementById('rta-canvas');
      if (rtaCanvas) {
        rtaCtx = rtaCanvas.getContext('2d');
        resizeCanvas(rtaCanvas);
        window.addEventListener('resize', () => resizeCanvas(rtaCanvas));
      }
    }

    function resizeCanvas(cvs) {
      if (!cvs) return;
      const dpr = window.devicePixelRatio || 1;
      cvs.width = cvs.offsetWidth * dpr;
      cvs.height = cvs.offsetHeight * dpr;
      const ctx = cvs.getContext('2d');
      ctx.scale(dpr, dpr);
    }

    function renderLiveMeters(data) {
      // 1. RTA SPECTRUM
      if (data.rta && rtaCtx && rtaCanvas) {
        drawRtaBars(data.rta);
      }

      // 2. DASHBOARD STRIP METERS & DETAIL METERS
      const vu = data.vu || [];
      const pre = data.pre || [];
      const gr = data.gr || [];

      // Channel maps:
      // IN1=0, IN2=1, OUT1=2, OUT2=3, OUT3=4, OUT4=5
      for (let i = 0; i < 6; i++) {
        const type = i < 2 ? 'in' : 'out';
        const idx = i < 2 ? i : (i - 2);

        // Pre-DSP VU
        const preDb = pre[i] !== undefined ? pre[i] : -80;
        const prePct = Math.max(0, Math.min(100, ((preDb + 60) / 72) * 100));
        const preBar = document.getElementById(`m-bar-pre-${type}-${idx}`);
        const preVal = document.getElementById(`m-val-pre-${type}-${idx}`);
        const prePeak = document.getElementById(`m-peak-pre-${type}-${idx}`);
        if (preBar) preBar.style.height = `${prePct}%`;
        if (preVal) preVal.textContent = Math.round(preDb);
        if (prePeak) prePeak.style.bottom = `${prePct}%`;

        // Post-DSP VU
        const postDb = vu[i] !== undefined ? vu[i] : -80;
        const postPct = Math.max(0, Math.min(100, ((postDb + 60) / 72) * 100));
        const postBar = document.getElementById(`m-bar-post-${type}-${idx}`);
        const postVal = document.getElementById(`m-val-post-${type}-${idx}`);
        const postPeak = document.getElementById(`m-peak-post-${type}-${idx}`);
        if (postBar) postBar.style.height = `${postPct}%`;
        if (postVal) postVal.textContent = Math.round(postDb);
        if (postPeak) postPeak.style.bottom = `${postPct}%`;

        // Limiter GR
        const grDb = gr[i] !== undefined ? gr[i] : 0;
        const grPct = Math.max(0, Math.min(100, (grDb / 18) * 100));
        const grBar = document.getElementById(`m-bar-gr-${type}-${idx}`);
        const grVal = document.getElementById(`m-val-gr-${type}-${idx}`);
        const grLed = document.getElementById(`m-led-gr-${type}-${idx}`);
        if (grBar) grBar.style.height = `${grPct}%`;
        if (grVal) grVal.textContent = grDb >= 0.5 ? `-${grDb.toFixed(1)}` : '0';
        if (grLed) {
          if (grDb >= 0.5) grLed.classList.add('active');
          else grLed.classList.remove('active');
        }

        // Update Channel Detail Limiter GR if active
        const isDetail = currentTab.startsWith('in-') || currentTab.startsWith('out-');
        if (isDetail && activeChType === type && activeChIdx === idx) {
          const detBar = document.getElementById('detail-bar-gr');
          const detVal = document.getElementById('detail-val-gr');
          const detLed = document.getElementById('detail-led-gr');
          if (detBar) detBar.style.width = `${grPct}%`;
          if (detVal) detVal.textContent = grDb >= 0.5 ? `-${grDb.toFixed(1)}` : '0';
          if (detLed) {
            if (grDb >= 0.5) detLed.classList.add('active');
            else detLed.classList.remove('active');
          }
        }
      }
    }

    function drawRtaBars(rta) {
      const w = rtaCanvas.offsetWidth;
      const h = rtaCanvas.offsetHeight;
      rtaCtx.clearRect(0, 0, w, h);

      const n = rta.length;
      const gap = 2;
      const barW = Math.max(2, (w - (n - 1) * gap) / n);

      for (let i = 0; i < n; i++) {
        const db = rta[i];
        const pct = Math.max(0, Math.min(1, (db + 80) / 80));
        const barH = pct * h;
        const x = i * (barW + gap);
        const y = h - barH;

        // Gradient
        const grad = rtaCtx.createLinearGradient(0, h, 0, 0);
        grad.addColorStop(0, '#00d2f0');
        grad.addColorStop(0.7, '#ff9100');
        grad.addColorStop(1, '#ff1744');

        rtaCtx.fillStyle = grad;
        rtaCtx.fillRect(x, y, barW, barH);
      }
    }

    // ==========================================
    // INTERACTIVE DSP GRAPH ENGINES
    // ==========================================
    function drawGrid(ctx, w, h, dbMin, dbMax) {
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = '#0e263d';
      ctx.lineWidth = 1;

      // Horizontal dB lines
      const dbSpan = dbMax - dbMin;
      for (let db = dbMin; db <= dbMax; db += 12) {
        const y = h - ((db - dbMin) / dbSpan) * h;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();

        ctx.fillStyle = '#446074';
        ctx.font = '10px Consolas, monospace';
        ctx.fillText(`${db > 0 ? '+' : ''}${db} dB`, 6, y - 3);
      }

      // Vertical Freq lines (Log scale: 20Hz to 20kHz)
      const freqs = [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];
      freqs.forEach(f => {
        const x = (Math.log10(f / 20) / 3) * w;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();

        ctx.fillStyle = '#446074';
        ctx.font = '9px Consolas, monospace';
        const lbl = f >= 1000 ? `${f / 1000}k` : `${f}`;
        ctx.fillText(lbl, x + 2, h - 5);
      });
    }

    // ==========================================
    // DSP MATH & CONVERSION HELPERS
    // ==========================================
    const throttledTimers = {};
    function throttledSetPath(path, value, delay = 35) {
      applyPathChange(path, value);
      if (!throttledTimers[path]) {
        throttledTimers[path] = setTimeout(() => {
          delete throttledTimers[path];
          const numVal = (typeof value === 'boolean') ? (value ? 1 : 0) : parseFloat(value);
          const payload = JSON.stringify({
            type: 'set',
            path: path,
            value: isNaN(numVal) ? value : numVal
          });
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(payload);
          } else {
            wsQueue.push(payload);
          }
        }, delay);
      }
    }

    function freqToLogSlider(f) {
      const norm = Math.log10(Math.max(20, Math.min(20000, f)) / 20) / 3;
      return Math.round(norm * 1000);
    }

    function logSliderToFreq(val) {
      const norm = Math.max(0, Math.min(1000, val)) / 1000;
      const f = 20 * Math.pow(10, norm * 3);
      return Math.round(f);
    }

    function freqToPos(f, w) {
      const normX = Math.log10(Math.max(20, Math.min(20000, f)) / 20) / 3;
      return normX * w;
    }

    function posToFreq(x, w) {
      const normX = Math.max(0, Math.min(1, x / w));
      const f = 20 * Math.pow(10, normX * 3);
      return Math.max(20, Math.min(20000, Math.round(f)));
    }

    function gainToPos(g, h) {
      const normY = (24 - Math.max(-24, Math.min(24, g))) / 48;
      return normY * h;
    }

    function posToGain(y, h) {
      const normY = Math.max(0, Math.min(1, y / h));
      const g = 24 - normY * 48;
      return Math.max(-24, Math.min(24, Math.round(g * 10) / 10));
    }

    function getCanvasEventPos(cvs, e) {
      const rect = cvs.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: Math.max(0, Math.min(rect.width, clientX - rect.left)),
        y: Math.max(0, Math.min(rect.height, clientY - rect.top)),
        w: rect.width,
        h: rect.height
      };
    }

    function calcBiquadDb(type, f0, g, q, f, fs = 48000) {
      if (type === 4) return 0; // ALLPASS has flat magnitude
      if (g === 0 && (type === 0 || type === 1 || type === 2)) return 0;
      const w0 = 2 * Math.PI * f0 / fs;
      const cw = Math.cos(w0);
      const sw = Math.sin(w0);
      const alpha = sw / (2 * q);
      const A = Math.pow(10, g / 40);
      let b0 = 1, b1 = 0, b2 = 0, a0 = 1, a1 = 0, a2 = 0;

      switch (type) {
        default:
        case 0: // BELL
          b0 = 1 + alpha * A; b1 = -2 * cw; b2 = 1 - alpha * A;
          a0 = 1 + alpha / A; a1 = -2 * cw; a2 = 1 - alpha / A;
          break;
        case 1: { // LOSHELF
          const sqA = Math.sqrt(A), t = 2 * sqA * alpha;
          b0 = A * ((A + 1) - (A - 1) * cw + t);
          b1 = 2 * A * ((A - 1) - (A + 1) * cw);
          b2 = A * ((A + 1) - (A - 1) * cw - t);
          a0 = (A + 1) + (A - 1) * cw + t;
          a1 = -2 * ((A - 1) + (A + 1) * cw);
          a2 = (A + 1) - (A - 1) * cw - t;
          break;
        }
        case 2: { // HISHELF
          const sqA = Math.sqrt(A), t = 2 * sqA * alpha;
          b0 = A * ((A + 1) + (A - 1) * cw + t);
          b1 = -2 * A * ((A - 1) + (A + 1) * cw);
          b2 = A * ((A + 1) - (A - 1) * cw - t);
          a0 = (A + 1) - (A - 1) * cw + t;
          a1 = 2 * ((A - 1) - (A + 1) * cw);
          a2 = (A + 1) - (A - 1) * cw - t;
          break;
        }
        case 3: // NOTCH
          b0 = 1; b1 = -2 * cw; b2 = 1;
          a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha;
          break;
        case 5: // LOWPASS
          b1 = 1 - cw; b0 = b1 * 0.5; b2 = b0;
          a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha;
          break;
        case 6: // HIGHPASS
          b1 = -(1 + cw); b0 = (1 + cw) * 0.5; b2 = b0;
          a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha;
          break;
      }
      const w = 2 * Math.PI * f / fs;
      const c1 = Math.cos(w), s1 = Math.sin(w), c2 = Math.cos(2 * w), s2 = Math.sin(2 * w);
      const nr = b0 + b1 * c1 + b2 * c2, ni = -(b1 * s1 + b2 * s2);
      const dr = a0 + a1 * c1 + a2 * c2, di = -(a1 * s1 + a2 * s2);
      return 10 * Math.log10((nr * nr + ni * ni) / (dr * dr + di * di + 1e-12));
    }
